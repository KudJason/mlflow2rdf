[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow2rdf"
version = "0.2.5"
description = "Convert MLflow tracking data into MLSO-aligned RDF Knowledge Graphs"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Master Thesis Project"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mlflow>=2.0.0",
    "rdflib>=6.0.0",
    "pyshacl>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/KudJason/mlflow2rdf"
Repository = "https://github.com/KudJason/mlflow2rdf"

[project.scripts]
mlflow2rdf = "mlflow2rdf.cli:main"

[tool.setuptools.packages.find]
include = ["mlflow2rdf*"]

[tool.setuptools.package-data]
# 修 2026-10-14：原来只声明了 shapes，漏掉 config ——
# 导致 PyPI 上的 wheel 里一个 YAML 都没有，装出来根本跑不起来
# （运行期 config_loader 会去找 config/*.yaml）。
# 另：morph_kgc.ini 也要打进去。
mlflow2rdf = [
    "shapes/*.ttl",
    "shapes/**/*.ttl",
    "config/*.yaml",
    "config/*.ini",
]
